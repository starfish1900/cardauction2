name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - name: Tests (engine, protocol, server integration with a fake clock)
        run: pnpm test
      - name: Random-play simulation (20,000 games, every invariant checked)
        run: pnpm sim --games 20000
      - name: Build the server bundle and the web client
        run: pnpm build
      - name: Smoke test (two bots play a whole game against the built server)
        env:
          NODE_ENV: production
          SESSION_SECRET: ci-only-secret-ci-only-secret-ci-only
          PORT: '3000'
        run: |
          node apps/server/dist/main.js &
          SERVER_PID=$!
          pnpm smoke --server http://localhost:3000
          kill -TERM "$SERVER_PID"
          wait "$SERVER_PID"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: pnpm --filter @cardauction/web exec playwright install --with-deps chromium
      - name: End-to-end tests (two browsers play whole games; desktop and phone layouts)
        run: pnpm e2e
      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
