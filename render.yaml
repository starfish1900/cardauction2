# Render Blueprint: https://render.com/docs/blueprint-spec
#
# Two services: the game server on Render's Starter plan ($7 a month, never sleeps) and the web
# client, a static site (always free). Games live in memory; Key Value snapshots, which would let
# a deploy hand games over instead of ending them, come with milestone M4, postponed for now.
services:
  - type: web
    runtime: node
    name: cardauction-server
    # Starter: 0.5 CPU and 512 MB, $7 a month, never sleeps. Render's plan ID since August 2026;
    # the older name "starter" means the same plan.
    plan: 0.5c-512mb
    region: ohio # nearest region to Toronto
    # pnpm is pinned to the version in package.json's packageManager field. The install takes
    # only the server and the workspace packages it uses, not the web client's dependencies.
    buildCommand: npx --yes pnpm@10.28.0 install --frozen-lockfile --filter @cardauction/server... && npx --yes pnpm@10.28.0 --filter @cardauction/server build
    startCommand: node --max-old-space-size=320 apps/server/dist/main.js
    healthCheckPath: /healthz
    # Render's default 30 s between SIGTERM and SIGKILL is plenty: the server stops in under a
    # second (15 s at most).
    # Deploy main only after GitHub Actions has passed.
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - apps/server/**
        - packages/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - tsconfig.base.json
        - render.yaml
        - .node-version
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '24'
      # Games live in memory: a deploy or restart ends the games in progress, and the players are
      # told. To deploy without interrupting anyone, drain the server first (see the README).
      - key: STATE_STORE
        value: memory
      # Caps for the Starter instance: further players are told the server is busy.
      - key: MAX_GAMES
        value: '250'
      - key: MAX_AI_GAMES
        value: '5'
      # The AI searches on one worker thread, off the main thread; an AI move waits at most this
      # long for it, queue included. On half a core a Hard move needs about 0.35 s on average and
      # 0.7 s at a game's start, within the 0.8–1.5 s its move waits anyway.
      - key: AI_THREADS
        value: '1'
      - key: AI_MAX_THINK_MS
        value: '8000'
      # Render generates these once; find them under the service's Environment tab.
      - key: SESSION_SECRET
        generateValue: true
      - key: METRICS_TOKEN
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      # Render sits behind Cloudflare, which puts the client's address in True-Client-IP.
      # Check after deploying: GET /admin/whoami with a forged True-Client-IP header must not
      # echo the forged value.
      - key: CLIENT_IP_HEADER
        value: true-client-ip
      # Every address the web client is served from, comma-separated: the server refuses a page
      # from any other, and that page then waits forever for the server. The custom domain (with
      # its www form) and the onrender.com address, which keeps working. Tools such as the
      # terminal client send no origin.
      - key: CORS_ORIGIN
        value: https://cardauction.ca,https://www.cardauction.ca,https://cardauction-web.onrender.com

  - type: web
    runtime: static
    name: cardauction-web
    # Installs only the web client and the workspace packages it uses.
    buildCommand: npx --yes pnpm@10.28.0 install --frozen-lockfile --filter @cardauction/web... && npx --yes pnpm@10.28.0 --filter @cardauction/web build
    staticPublishPath: apps/web/dist
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - apps/web/**
        # The workspace packages the web client uses (apps/web/src/deploy.test.ts checks the
        # list), so a change to the AI alone does not rebuild the site.
        - packages/engine/**
        - packages/protocol/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - tsconfig.base.json
        - render.yaml
        - .node-version
    envVars:
      - key: NODE_VERSION
        value: '24'
      # Baked into the build: where the client finds the game server.
      - key: VITE_SERVER_URL
        value: https://cardauction-server.onrender.com
    # One page for every path (/join/CODE links included). Real files are served first.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # File names under /assets carry a content hash: they never change.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # Keep in step with apps/web/vite.config.ts, which applies the same policy to the
      # end-to-end tests.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://cardauction-server.onrender.com wss://cardauction-server.onrender.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
