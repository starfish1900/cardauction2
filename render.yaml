# Render Blueprint: https://render.com/docs/blueprint-spec
#
# Two services: the game server (Render's free plan while the game is being built: it sleeps
# after 15 idle minutes and takes about a minute to wake) and the web client, a static site
# (always free). The Key Value instance arrives with M4; M5 moves the server to Starter
# ($7 a month).
services:
  - type: web
    runtime: node
    name: cardauction-server
    plan: free
    region: ohio # nearest region to Toronto
    # pnpm is pinned to the version in package.json's packageManager field.
    buildCommand: npx --yes pnpm@10.28.0 install --frozen-lockfile && npx --yes pnpm@10.28.0 --filter @cardauction/server build
    startCommand: node --max-old-space-size=320 apps/server/dist/main.js
    healthCheckPath: /healthz
    maxShutdownDelaySeconds: 60
    # Deploy main only after GitHub Actions has passed.
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - apps/server/**
        - packages/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - render.yaml
        - .node-version
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '24'
      # Games live in memory until M4 brings Key Value snapshots; a deploy ends them.
      - key: STATE_STORE
        value: memory
      # Caps for the free instance (0.1 CPU); Starter raises them to 250 and 5.
      - key: MAX_GAMES
        value: '50'
      - key: MAX_AI_GAMES
        value: '3'
      # Render generates these once; find them under the service's Environment tab.
      - key: SESSION_SECRET
        generateValue: true
      - key: METRICS_TOKEN
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      # Render sits behind Cloudflare, which puts the client's address in True-Client-IP.
      # Check after deploying: GET /admin/whoami with a forged True-Client-IP header must not
      # echo the forged value.
      - key: CLIENT_IP_HEADER
        value: true-client-ip
      # The web client's address (M2). Tools such as the terminal client send no origin.
      - key: CORS_ORIGIN
        value: https://cardauction-web.onrender.com

  - type: web
    runtime: static
    name: cardauction-web
    buildCommand: npx --yes pnpm@10.28.0 install --frozen-lockfile && npx --yes pnpm@10.28.0 --filter @cardauction/web build
    staticPublishPath: apps/web/dist
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - apps/web/**
        - packages/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - render.yaml
        - .node-version
    envVars:
      - key: NODE_VERSION
        value: '24'
      # Baked into the build: where the client finds the game server.
      - key: VITE_SERVER_URL
        value: https://cardauction-server.onrender.com
    # One page for every path (/join/CODE links included). Real files are served first.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # File names under /assets carry a content hash: they never change.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # Keep in step with apps/web/vite.config.ts, which applies the same policy to the
      # end-to-end tests.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://cardauction-server.onrender.com wss://cardauction-server.onrender.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
